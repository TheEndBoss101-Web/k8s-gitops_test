config:
  spec:
    destination:
      server: https://kubernetes.default.svc
      namespace: default
    source:
      repoURL: https://github.com/TheEndBoss101-Web/k8s-gitops_test.git
      targetRevision: HEAD

applications:
  # ── Git-based apps (folders at repo root) ─────────────────────────────────
  - name: whoami
  - name: gitlab
  - name: metallb-config
  - name: postgresql
  - name: vaultwarden

  # ── External Helm charts ──────────────────────────────────────────────────
  - name: traefik
    namespace: argocd
    destination:
      namespace: traefik
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 40.2.0
    helm:
      valueFiles:
        - https://raw.githubusercontent.com/TheEndBoss101-Web/k8s-gitops_test/main/traefik/values.yaml
      values: |
        fullnameOverride: traefik

  - name: longhorn
    namespace: argocd
    destination:
      namespace: longhorn-system
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.8.1
    helm:
      valueFiles:
        - https://raw.githubusercontent.com/TheEndBoss101-Web/k8s-gitops_test/main/longhorn/values.yaml
      values: |
        fullnameOverride: longhorn

  - name: metallb
    namespace: argocd
    destination:
      namespace: metallb-system
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.14.9
    helm:
      valueFiles:
        - https://raw.githubusercontent.com/TheEndBoss101-Web/k8s-gitops_test/main/metallb/values.yaml
      values: |
        fullnameOverride: metallb